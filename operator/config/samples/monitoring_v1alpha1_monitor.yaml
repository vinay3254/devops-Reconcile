apiVersion: monitoring.statuspage.io/v1alpha1
kind: Monitor
metadata:
  name: google-monitor
  namespace: default
  labels:
    app.kubernetes.io/name: statuspage-operator
spec:
  url: "https://www.google.com"
  intervalSeconds: 60
  expectedStatus: 200
  timeoutSeconds: 10
---
apiVersion: monitoring.statuspage.io/v1alpha1
kind: Monitor
metadata:
  name: github-monitor
  namespace: default
  labels:
    app.kubernetes.io/name: statuspage-operator
spec:
  url: "https://github.com"
  intervalSeconds: 120
  expectedStatus: 200
  timeoutSeconds: 10
---
apiVersion: monitoring.statuspage.io/v1alpha1
kind: Monitor
metadata:
  name: httpbin-monitor
  namespace: default
  labels:
    app.kubernetes.io/name: statuspage-operator
spec:
  url: "https://httpbin.org/status/200"
  intervalSeconds: 30
  expectedStatus: 200
  timeoutSeconds: 5
