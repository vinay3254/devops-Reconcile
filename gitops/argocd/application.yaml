apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: statuspage-stack-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/vinay3254/devops-Reconcile.git'
    targetRevision: HEAD
    path: charts/statuspage-stack
    helm:
      valueFiles:
        - '../../gitops/environments/staging/values.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: statuspage-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
